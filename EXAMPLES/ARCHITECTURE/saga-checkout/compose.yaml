services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
      POSTGRES_DB: saga_checkout
    ports: ["127.0.0.1:55439:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d saga_checkout"]
      interval: 2s
      timeout: 2s
      retries: 20
